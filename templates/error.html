<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>{{ code }} - GuideToAnime</title>
{% include "_head.html" %}
<style>
  body { margin:0; min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; text-align:center; padding:24px;
         background:radial-gradient(900px 450px at 50% 0%,#14234a 0%,#060914 65%) no-repeat,#060914; color:#f2f6ff; font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif; }
  h1 { margin:0; font-size:72px; letter-spacing:-2px; color:#5ec8ff; text-shadow:0 0 24px rgba(94,200,255,.5); }
  h2 { margin:0; font-size:22px; } p { margin:0; color:#8e9bc0; max-width:420px; line-height:1.5; }
  a.btn { margin-top:12px; padding:10px 18px; border-radius:10px; background:#5ec8ff; color:#04121f; font-weight:700; text-decoration:none; }
  small { margin-top:18px; color:#8e9bc0; } small a { color:#8e9bc0; }
</style>
</head>
<body>
  <h1>{{ code }}</h1>
  <h2>{{ title }}</h2>
  <p>{{ msg }}</p>
  <a class="btn" href="/">Back to home</a>
  <small>{% include "_links.html" %}</small>
</body>
</html>
